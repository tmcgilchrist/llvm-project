# Tests that compile Haskell need GHC. Use $LLDB_TEST_GHC if set, otherwise
# the baseline compiler (ghc-9.12.2, as installed by ghcup), otherwise any
# `ghc` on PATH. When one is found, this provides:
#
#   REQUIRES: ghc               GHC is available
#   REQUIRES: ghc-<maj>.<min>   e.g. ghc-9.12
#   %ghc                        the compiler
import os
import shutil
import subprocess

ghc = (
    os.environ.get("LLDB_TEST_GHC")
    or shutil.which("ghc-9.12.2")
    or shutil.which("ghc")
)
if ghc:
    try:
        version = subprocess.run(
            [ghc, "--numeric-version"],
            capture_output=True,
            text=True,
            check=True,
            timeout=60,
        ).stdout.strip()
    except (OSError, subprocess.SubprocessError):
        version = None
    if version:
        config.available_features.add("ghc")
        major_minor = ".".join(version.split(".")[:2])
        config.available_features.add("ghc-" + major_minor)
        config.substitutions.append(("%ghc", ghc))
        # GHC calls the C compiler and linker, so it needs the user's PATH
        # after the tool directories lit has already set up.
        paths = [config.environment.get("PATH"), os.environ.get("PATH")]
        config.environment["PATH"] = os.pathsep.join(p for p in paths if p)
        if "HOME" in os.environ:
            config.environment["HOME"] = os.environ["HOME"]
